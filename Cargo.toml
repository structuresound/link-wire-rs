[workspace]
members = ["crates/tactus-wire", "crates/tactus"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/structuresound/link-wire-rs"
rust-version = "1.85"

[workspace.dependencies]
tactus-wire = { path = "crates/tactus-wire", version = "0.1.0" }
socket2 = { version = "0.6", features = ["all"] }
getrandom = "0.3"
# Interface enumeration (tactus::iface). Both are already in the graph via
# socket2; the windows-sys features add bindings, not crates.
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
